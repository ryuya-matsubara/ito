name: Deploy AWS backend
on:
  push:
    branches: [main]
    paths: [deploy-trigger.txt]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ito-aws-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.AWS_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ito-github-actions-role
          aws-region: ap-northeast-1
      - uses: aws-actions/setup-sam@v2
      - run: sam build
      - name: Package application
        run: >
          sam package
          --s3-bucket ito-github-deploy-${{ vars.AWS_ACCOUNT_ID }}-ap-northeast-1
          --s3-prefix ito-game
          --output-template-file packaged.yaml
      - name: Update CloudFormation stack
        shell: bash
        run: |
          set +e
          deploy_output=$(aws cloudformation update-stack \
            --stack-name ito-game \
            --region ap-northeast-1 \
            --template-body file://packaged.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND 2>&1)
          deploy_status=$?
          set -e
          if [ "$deploy_status" -ne 0 ]; then
            if [[ "$deploy_output" == *"No updates are to be performed"* ]]; then
              echo "No backend changes to deploy."
              exit 0
            fi
            echo "$deploy_output"
            exit "$deploy_status"
          fi
          if ! aws cloudformation wait stack-update-complete \
            --stack-name ito-game \
            --region ap-northeast-1; then
            echo "CloudFormation update failed. Recent stack events:"
            aws cloudformation describe-stack-events \
              --stack-name ito-game \
              --region ap-northeast-1 \
              --query "StackEvents[:30].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table
            exit 1
          fi
          echo "Backend deployment completed."
