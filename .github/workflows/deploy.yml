name: Deploy AWS backend
on:
  push:
    branches: [main]
    paths: [deploy-trigger.txt]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ito-aws-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.AWS_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'))
            core.info(`OIDC issuer: ${claims.iss}`)
            core.info(`OIDC audience: ${claims.aud}`)
            core.info(`OIDC subject: ${claims.sub}`)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ito-github-actions-role
          aws-region: ap-northeast-1
      - uses: aws-actions/setup-sam@v2
      - run: sam build
      - run: >
          sam deploy
          --s3-bucket ito-github-deploy-${{ vars.AWS_ACCOUNT_ID }}-ap-northeast-1
          --s3-prefix ito-game
          --stack-name ito-game
          --region ap-northeast-1
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
