AWSTemplateFormatVersion: '2010-09-09'
Description: One-time GitHub Actions OIDC setup for ito
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]
  DeploymentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ito-github-deploy-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ito-github-actions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: repo:ryuya-matsubara/ito:ref:refs/heads/main
      Policies:
        - PolicyName: DeployItoSamStack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeChangeSet
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ito-game/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::ito-github-deploy-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:s3:::ito-github-deploy-${AWS::AccountId}-${AWS::Region}/*
              - Effect: Allow
                Action: [lambda:CreateFunction, lambda:UpdateFunctionCode, lambda:UpdateFunctionConfiguration, lambda:GetFunction, lambda:DeleteFunction, lambda:AddPermission, lambda:RemovePermission, lambda:TagResource, lambda:UntagResource, lambda:ListTags]
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ito-game-*
              - Effect: Allow
                Action: [dynamodb:CreateTable, dynamodb:DescribeTable, dynamodb:UpdateTable, dynamodb:DeleteTable, dynamodb:TagResource, dynamodb:UntagResource, dynamodb:ListTagsOfResource, dynamodb:UpdateTimeToLive, dynamodb:DescribeTimeToLive]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ito-game-*
              - Effect: Allow
                Action: apigateway:*
                Resource: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/*
              - Effect: Allow
                Action: [iam:CreateRole, iam:GetRole, iam:DeleteRole, iam:PassRole, iam:PutRolePolicy, iam:GetRolePolicy, iam:ListRolePolicies, iam:DeleteRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:TagRole, iam:UntagRole]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ito-game-*
Outputs:
  AwsAccountId:
    Value: !Ref AWS::AccountId
  RoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
