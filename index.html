<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4b942"><title>ito</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><div class="logo">ito</div><p>価値観をつないで、数字を当てよう</p></header><section id="home" class="panel"><label>あなたの名前<input id="name" maxlength="12" autocomplete="nickname" placeholder="例：りゅうや"></label><button id="create" class="primary">ルームを作る</button><div class="divider"><span>または</span></div><label>4桁のルーム番号<input id="roomCode" inputmode="numeric" maxlength="4" placeholder="1234"></label><button id="join">ルームに参加</button></section><section id="room" class="panel hidden"><div class="room-head"><span>ROOM</span><strong id="code">----</strong><button id="copy" class="small">コピー</button></div><p id="status" class="status">接続中…</p><div id="players" class="players"></div><div id="hostSetup" class="hidden"><label>お題<input id="topic" maxlength="40" placeholder="例：食べ物の人気度"></label><div id="topicSuggestions" class="chips"></div><button id="start" class="primary">ゲーム開始</button></div><div id="waiting" class="hidden center"><div class="pulse">●</div><h2>ゲームマスターを待っています</h2></div><div id="play" class="hidden"><div class="topic-label">今回のお題</div><h2 id="topicDisplay" class="topic"></h2><div id="closedCard" class="card closed"><span>?</span></div><button id="reveal" class="primary">数字を見る</button><div id="revealedArea" class="hidden"><div id="numberCard" class="card number"></div><label>この数字を表す回答<input id="answer" maxlength="30" placeholder="回答を入力"></label><button id="submit" class="primary">決定</button></div></div><div id="locked" class="hidden center"><div class="answer-card"><small id="lockedName"></small><strong id="lockedAnswer"></strong><div id="openedNumber" class="opened-number hidden"></div></div><p id="readyCount"></p><p id="lineupHint">全員揃ったら、回答を見せ合って小さいと思う順にスマホを並べよう！</p><button id="open" class="primary danger hidden">OPEN</button><button id="next" class="primary hidden">次のゲームへ</button></div></section><div id="toast" role="alert" aria-live="polite"></div></main><script src="./config.js"></script><script src="./app.js"></script></body></html>
